<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CloudDocs - Hệ thống lưu trữ tài liệu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">CloudDocs - Quản lý và Chia sẻ Tài liệu</h2>
    
    <!-- Form Upload File -->
    <form action="/upload" method="POST" enctype="multipart/form-data" class="mb-4 p-4 border rounded bg-light">
        <div class="mb-3">
            <label for="file" class="form-label">Chọn tài liệu tải lên (PDF, Word, Ảnh...):</label>
            <input class="form-control" type="file" id="file" name="file" required>
        </div>
        <button type="submit" class="btn btn-primary">Tải lên Cloud</button>
    </form>

    <!-- Danh sách tài liệu đã lưu -->
    <h3>Danh sách tài liệu trên hệ thống</h3>
    <ul class="list-group">
        {% for doc in docs %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ doc.filename }}
                <a href="{{ doc.blob_url }}" target="_blank" class="btn btn-sm btn-success">Tải xuống / Xem</a>
            </li>
        {% else %}
            <li class="list-group-item text-muted">Chưa có tài liệu nào được tải lên.</li>
        {% endfor %}
    </ul>
</body>
</html>
